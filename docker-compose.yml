version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: infokes-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infokes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infokes-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: infokes-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/infokes_db
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app/packages/backend
    networks:
      - infokes-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    container_name: infokes-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/src
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    networks:
      - infokes-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  infokes-network:
    driver: bridge
