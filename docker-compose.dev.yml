version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: infokes-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infokes_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infokes-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: infokes-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: infokes_db
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/backend/tests:/app/packages/backend/tests
    networks:
      - infokes-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: infokes-frontend-dev
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/public:/app/packages/frontend/public
      - ./packages/frontend/tests:/app/packages/frontend/tests
      - ./packages/frontend/vite.config.js:/app/packages/frontend/vite.config.js
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    networks:
      - infokes-network
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  infokes-network:
    driver: bridge
